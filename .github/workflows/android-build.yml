name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Regenerate Curated Data Bundle
        run: python3 build_data_bundle.py

      - name: Create Cordova Project Wrapper
        run: |
          cordova create wrapper com.sdtcloud.challenge "100 Challenge" --no-telemetry
          mv wrapper/config.xml .
          mkdir -p www
          rsync -av --exclude='wrapper' --exclude='.git' --exclude='.github' \
                --exclude='www' --exclude='platforms' --exclude='plugins' \
                --exclude='node_modules' ./ www/
          cordova platform add android --no-telemetry

      - name: Configure App (name + internet permission)
        run: |
          sed -i 's|<content src="index.html" />|<content src="index.html" />\n    <allow-intent href="http://*/*" />\n    <allow-intent href="https://*/*" />|' config.xml || true
          python3 - <<'PY'
          import re
          with open('www/index.html', 'r', encoding='utf-8') as f:
              html = f.read()
          print('index.html size:', len(html))
          PY

      - name: Build Android APK (Debug)
        run: cordova build android --no-telemetry

      - name: Locate APK
        id: apk
        run: |
          APK=$(find platforms/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK: $APK"
          echo "path=$APK" >> $GITHUB_OUTPUT
          cp "$APK" ./100-Challenge.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 100-Challenge-APK
          path: ./100-Challenge.apk
          if-no-files-found: error

      - name: Publish Downloadable Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" ./100-Challenge.apk \
            --title "100 Challenge — APK derleme #${GITHUB_RUN_NUMBER}" \
            --notes "Otomatik derlendi. APK dosyasını indirip Android telefona kurabilirsin.

          Değişiklikler: Posterler görünür oldukça yüklenir; URL aramaları cihazda saklanır. API görseli yoksa film 🎬, anime 🎌, oyun 🎮 simgeleri gösterilir."
