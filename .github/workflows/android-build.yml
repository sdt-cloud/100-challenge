name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project Wrapper
        run: |
          # Create a temporary Cordova project
          cordova create wrapper com.sdtcloud.challenge "100 Challenge"
          
          # Move cordova files to current root directory
          mv wrapper/config.xml .
          mv wrapper/package.json cordova-package.json
          
          # Prepare www directory
          mkdir -p www
          # Copy app assets (except the wrapper itself and git files)
          rsync -av --exclude='wrapper' --exclude='.git' --exclude='.github' ./ www/
          
          # Add Android platform
          cordova platform add android --no-telemetry

      - name: Build Android APK (Debug)
        run: |
          cordova build android --device --no-telemetry

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 100-Challenge-APK
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
